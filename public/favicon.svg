<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3B82F6"/>
      <stop offset="50%" stopColor="#60A5FA"/>
      <stop offset="100%" stopColor="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="16" cy="16" r="16" fill="url(#faviconGradient)"/>
  <!-- Four Leaf Clover -->
  <g transform="translate(16, 16)">
    <ellipse cx="-6" cy="-6" rx="5" ry="7" fill="#166534" transform="rotate(-45)"/>
    <ellipse cx="6" cy="-6" rx="5" ry="7" fill="#166534" transform="rotate(45)"/>
    <ellipse cx="-6" cy="6" rx="5" ry="7" fill="#166534" transform="rotate(-135)"/>
    <ellipse cx="6" cy="6" rx="5" ry="7" fill="#166534" transform="rotate(135)"/>
    <circle cx="0" cy="0" r="3" fill="#22C55E"/>
  </g>
  <!-- LKC Text -->
  <text x="16" y="28" textAnchor="middle" fontSize="6" fontWeight="bold" fill="white" fontFamily="Arial" letterSpacing="1">LKC</text>
</svg>
